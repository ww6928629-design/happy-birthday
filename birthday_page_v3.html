
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生日特权系统 v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050816;color:#fff;font-family:system-ui;overflow:hidden}
canvas{position:fixed;inset:0}
.main{position:relative;z-index:2;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:560px;width:100%;padding:28px;border-radius:24px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);text-align:center}
button{padding:14px 28px;border:none;border-radius:999px;cursor:pointer;margin-top:18px}
#cake{display:none;font-size:110px;cursor:pointer;margin:15px 0}
.floatWish{position:fixed;pointer-events:none;animation:f 2.5s forwards;font-weight:bold}
@keyframes f{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.fire{position:fixed;pointer-events:none;animation:b 1.5s linear forwards}
@keyframes b{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--x),var(--y))}}
.info{margin-top:10px;line-height:1.8}
</style></head><body>
<canvas id="bg"></canvas>
<div class="main"><div class="card">
<h1 id="title">系统检测到一位寿星</h1>
<div class="info" id="buff">正在核验身份...</div>
<button id="btn">领取生日特权</button>
<div id="cake">🎂</div>
<div class="info" id="status"></div>
<div class="info" id="lv"></div>
<div class="info" id="ach"></div>
</div></div>

<script>
const c=bg,ctx=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
let s=[...Array(180)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2,v:.2+Math.random()*.4}));
(function a(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='white';s.forEach(i=>{ctx.beginPath();ctx.arc(i.x,i.y,i.r,0,7);ctx.fill();i.y+=i.v;if(i.y>innerHeight)i.y=0});requestAnimationFrame(a)})();

document.addEventListener("click",e=>{
if(e.target.id==="cake")return;
let d=document.createElement("div");
d.className="floatWish";
d.innerHTML="🎉 祝你生日快乐";
d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px";
document.body.appendChild(d); setTimeout(()=>d.remove(),2500);
});

const buffs=[
{name:"暴富概率",value:88,max:100,step:[1,3],ach:"💰 财神爷重点关注对象"},
{name:"游戏爆率",value:300,max:500,step:[10,30],ach:"🎮 欧皇降世"},
{name:"幸运值",value:50,max:100,step:[1,5],ach:"🌟 幸运女神VIP会员"},
{name:"摸鱼时间",value:24,max:48,step:[1,2],ach:"😴 摆烂界传奇"},
{name:"奶茶储备",value:0,max:20,step:[1,3],ach:"🧋 奶茶批发商"}
];

let buffObj=null,xp=0,level=1,clicks=0;

btn.onclick=()=>{
buffObj=JSON.parse(JSON.stringify(buffs[Math.floor(Math.random()*buffs.length)]));
title.innerHTML="🎂 Happy Birthday 🎂";
showBuff();
btn.style.display="none";
cake.style.display="block";
lv.innerHTML="Lv.1 新手寿星";
};

function showBuff(){
let unit="";
if(buffObj.name==="暴富概率"||buffObj.name==="幸运值") unit="%";
if(buffObj.name==="游戏爆率") unit="%";
if(buffObj.name==="摸鱼时间") unit="小时";
if(buffObj.name==="奶茶储备") unit="杯";
buff.innerHTML=`当前BUFF：${buffObj.name} ${buffObj.value}${unit}`;
}

cake.onclick=()=>{
clicks++;
xp++;

level=Math.floor(xp/5)+1;

const titles=["新手寿星","资深寿星","高级寿星","传奇寿星","神话寿星"];
lv.innerHTML=`Lv.${level} ${titles[Math.min(titles.length-1,Math.floor(level/2))]}`;

let add=Math.floor(Math.random()*(buffObj.step[1]-buffObj.step[0]+1))+buffObj.step[0];

buffObj.value=Math.min(buffObj.max,buffObj.value+add);

let unit="";
if(buffObj.name==="暴富概率"||buffObj.name==="幸运值") unit="%";
if(buffObj.name==="游戏爆率") unit="%";
if(buffObj.name==="摸鱼时间") unit="小时";
if(buffObj.name==="奶茶储备") unit="杯";

status.innerHTML=`${buffObj.name} +${add}${unit}`;
showBuff();

if(clicks%5===0){
const arr=[
"🏆 寿星本星",
"🏆 蛋糕征服者",
"🏆 快乐制造机",
"🏆 今天我最大",
"🏆 好运收藏家",
"🏆 欧皇降临"
];
ach.innerHTML=arr[Math.floor(Math.random()*arr.length)];
fw(25);
}

if(buffObj.value>=buffObj.max){
ach.innerHTML=buffObj.ach;
fw(80);
}
};

function fw(n){
for(let i=0;i<n;i++){
let e=document.createElement("div");
e.className="fire";
e.innerHTML=["🎉","✨","🎊","⭐"][Math.floor(Math.random()*4)];
e.style.left=innerWidth/2+"px";
e.style.top=innerHeight/2+"px";
e.style.setProperty("--x",(Math.random()*900-450)+"px");
e.style.setProperty("--y",(Math.random()*900-450)+"px");
document.body.appendChild(e);
setTimeout(()=>e.remove(),1500);
}
}
</script></body></html>
